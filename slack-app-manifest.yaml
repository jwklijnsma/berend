# Slack: Create New App -> From a manifest -> paste this.
display_information:
  name: Berend
  description: Berend answers questions from our docs, GitLab, Argo CD and the web (local LLM)
  background_color: "#1d3557"
features:
  bot_user:
    display_name: berend
    always_online: true
  app_home:
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - channels:history
      - groups:history
      - im:history
      - im:read
      - im:write
      - reactions:write
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
      - message.channels      # thread follow-ups without @mention
      - message.groups
  interactivity:
    is_enabled: true          # feedback buttons (works over Socket Mode, no URL needed)
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false

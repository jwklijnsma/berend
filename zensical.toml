# Berend documentation - built with Zensical (https://zensical.org), same design as shift-mox
#   pip install -r requirements-docs.txt
#   zensical serve            # preview on http://localhost:8000
#   zensical build --strict   # what CI runs

[project]
site_name = "Berend"
site_description = "Local-LLM (Ollama) assistant for a platform team: Q&A in Slack and Mattermost, and Argo CD alerts with likely cause"
site_url = "https://jwklijnsma.github.io/berend/"
repo_url = "https://github.com/jwklijnsma/berend"
repo_name = "jwklijnsma/berend"
edit_uri = "edit/main/docs/"
copyright = "Berend - runs on your own Ollama"
nav = [
  { "Home" = "index.md" },
  { "Quick start" = "quickstart.md" },
  { "Features" = [
    { "Answers" = "answers.md" },
    { "Argo CD alerts" = "alerts.md" },
    { "Speed" = "speed.md" },
  ] },
  { "Deploy" = [
    { "OpenShift with Argo CD" = "deploy.md" },
  ] },
  { "Reference" = [
    { "Sources" = "sources.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "navigation.footer",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "search.highlight",
]

[project.theme.icon]
logo = "material/robot-happy"
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "teal"
accent = "deep orange"
toggle.icon = "material/weather-night"
toggle.name = "Dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "teal"
accent = "deep orange"
toggle.icon = "material/weather-sunny"
toggle.name = "Light mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.snippets = {}
pymdownx.tabbed.alternate_style = true
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
